name: Playwright Automation Tests

# Trigger workflow whenever code is pushed
on:
  push:

# Define jobs
jobs:
  playwright-tests:
    # GitHub will provide an Ubuntu machine
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your GitHub repository code
      - name: Checkout repository
        uses: actions/checkout@v6

      # Step 2: Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Step 3: Install project dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Install Playwright browsers and dependencies
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Step 5: Execute Playwright tests
      - name: Run Playwright tests
        run: npx playwright test
